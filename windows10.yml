# PC-Free - Windows 10/11 in a Docker container
# KVM-enabled with host networking

services:
  windows:
    image: dockurr/windows
    container_name: windows
    network_mode: host
    environment:
      VERSION: "10"
      USERNAME: ${WINDOWS_USERNAME}
      PASSWORD: ${WINDOWS_PASSWORD}
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "30G"
      DNS: "8.8.8.8"
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/kvm:/dev/kvm"
      - "/dev/net/tun:/dev/net/tun"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - windows-data:/storage
      - windows-shared:/shared
    stop_grace_period: 2m
    restart: always

volumes:
  windows-data:
  windows-shared: